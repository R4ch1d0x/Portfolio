<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-label="Architecture: user input goes to the CryptXplorer Python app, then the AES-CTR engine (key plus nonce and counter into AES, keystream XOR plaintext), then output; built with Python libraries and a testing module" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
