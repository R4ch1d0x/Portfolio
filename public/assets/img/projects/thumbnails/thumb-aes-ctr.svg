<text x="400" y="315" fill="#777" font-size="10" letter-spacing="2">TESTING &amp; ANALYSIS</text>
<g font-size="10.5" fill="#ccc">
<path d="M190 333l5 5 9-10" fill="none" stroke="#ff3344" stroke-width="2"/>
<text x="210" y="338" text-anchor="start">Enc / Dec tests</text>
