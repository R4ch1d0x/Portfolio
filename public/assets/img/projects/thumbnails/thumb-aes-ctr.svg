<text x="374" y="338" text-anchor="start">Performance</text>
<circle cx="508" cy="332" r="6" fill="none" stroke="#ffaa00" stroke-width="2"/><line x1="513" y1="337" x2="518" y2="343" stroke="#ffaa00" stroke-width="2"/>
<text x="526" y="338" text-anchor="start">Wireshark</text>
</g>
