<line x1="542" y1="145" x2="560" y2="145" stroke="#ff3344" marker-end="url(#a)"/>
<rect x="562" y="126" width="78" height="38" rx="4" fill="rgba(154, 164, 178,.1)" stroke="#9aa4b2"/>
<text x="601" y="149" fill="#9aa4b2" font-size="10.5">Ciphertext</text>
<rect x="330" y="178" width="80" height="22" rx="4" fill="#0a0a0a" stroke="#ccc" stroke-opacity=".4"/>
