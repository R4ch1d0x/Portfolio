<text x="400" y="270" fill="#9aa4b2" font-size="12">Python  ·  PyCryptodome  ·  Tkinter / CustomTkinter  ·  Matplotlib</text>
<line x1="400" y1="283" x2="400" y2="297" stroke="#9aa4b2" marker-start="url(#c)" marker-end="url(#c)"/>

<!-- TESTING -->
