<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-label="Architecture: an attacker runs Slowloris DoS, ARP poisoning and DNS spoofing against a client, switch and Apache server in an isolated virtual lab; defenses are DAI, arpwatch, DNSSEC, DoH, iptables and fail2ban" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f04b38" stroke-opacity=".05"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f04b38"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a7a"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fd6e0"/></marker>
</defs>
<g font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle">
<rect width="800" height="366" fill="#000"/>
<rect width="800" height="366" fill="url(#g)"/>
<rect x=".5" y=".5" width="799" height="365" fill="none" stroke="#1a1a1a"/>

<!-- ATTACKER -->
<rect x="15" y="40" width="100" height="170" rx="6" fill="#0a0a0a" stroke="#ff8a7a" stroke-opacity=".6"/>
<text x="65" y="62" fill="#ff8a7a" font-weight="700" font-size="12">Attacker</text>
<g font-size="10">
<rect x="25" y="82" width="80" height="26" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="65" y="99" fill="#ccc">Slowloris</text>
<rect x="25" y="118" width="80" height="26" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="65" y="135" fill="#ccc">ARP poison</text>
<rect x="25" y="154" width="80" height="26" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="65" y="171" fill="#ccc">DNS spoof</text>
</g>
<line x1="118" y1="125" x2="137" y2="125" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>

<!-- LAB -->
<rect x="140" y="40" width="400" height="170" rx="6" fill="rgba(240,75,56,.03)" stroke="#f04b38" stroke-dasharray="6 4"/>
<text x="340" y="62" fill="#f04b38" font-weight="700" font-size="12">Virtual Lab</text>
<rect x="170" y="74" width="340" height="24" rx="12" fill="rgba(79,214,224,.08)" stroke="#4fd6e0"/>
<text x="340" y="90" fill="#4fd6e0" font-size="11">VMs · isolated network</text>
<rect x="165" y="126" width="80" height="38" rx="4" fill="rgba(79,214,224,.1)" stroke="#4fd6e0"/>
<text x="205" y="149" fill="#4fd6e0" font-size="10.5">Client</text>
<line x1="245" y1="145" x2="265" y2="145" stroke="#f04b38" marker-end="url(#a)"/>
<rect x="267" y="126" width="100" height="38" rx="4" fill="rgba(240,75,56,.1)" stroke="#ff8a7a" stroke-width="1.5"/>
<text x="317" y="149" fill="#ff8a7a" font-size="10.5" font-weight="700">Switch / GW</text>
<line x1="367" y1="145" x2="389" y2="145" stroke="#f04b38" marker-end="url(#a)"/>
<rect x="391" y="126" width="112" height="38" rx="4" fill="rgba(240,75,56,.1)" stroke="#ff8a7a" stroke-width="1.5"/>
<text x="447" y="149" fill="#ff8a7a" font-size="10.5" font-weight="700">Apache Server</text>
<g font-size="10">
<rect x="160" y="177" width="110" height="22" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="215" y="192" fill="#ff8a7a">ARP poisoning</text>
<rect x="278" y="177" width="100" height="22" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="328" y="192" fill="#ff8a7a">DNS spoofing</text>
<rect x="386" y="177" width="124" height="22" rx="4" fill="rgba(240,75,56,.08)" stroke="#ff8a7a" stroke-opacity=".6"/><text x="448" y="192" fill="#ff8a7a">Slowloris DoS</text>
</g>
<line x1="543" y1="125" x2="567" y2="125" stroke="#f04b38" stroke-width="2" marker-end="url(#a)"/>

<!-- DEFENSES -->
<rect x="570" y="40" width="215" height="170" rx="6" fill="#0a0a0a" stroke="#f04b38" stroke-opacity=".6"/>
<text x="677" y="62" fill="#f04b38" font-weight="700" font-size="12">Defenses</text>
<rect x="585" y="80" width="185" height="30" rx="4" fill="rgba(240,75,56,.08)" stroke="#f04b38"/>
<circle cx="601" cy="95" r="4" fill="#f04b38"/><text x="615" y="99" fill="#f04b38" font-size="10.5" text-anchor="start">DAI · arpwatch</text>
<rect x="585" y="122" width="185" height="30" rx="4" fill="rgba(240,75,56,.08)" stroke="#f04b38"/>
<circle cx="601" cy="137" r="4" fill="#f04b38"/><text x="615" y="141" fill="#f04b38" font-size="10.5" text-anchor="start">DNSSEC · DoH</text>
<rect x="585" y="164" width="185" height="30" rx="4" fill="rgba(240,75,56,.08)" stroke="#f04b38"/>
<circle cx="601" cy="179" r="4" fill="#f04b38"/><text x="615" y="183" fill="#f04b38" font-size="10.5" text-anchor="start">iptables · fail2ban</text>

<!-- vertical links -->
<line x1="65" y1="213" x2="65" y2="247" stroke="#4fd6e0" marker-start="url(#c)" marker-end="url(#c)"/>
<line x1="340" y1="213" x2="340" y2="247" stroke="#4fd6e0" marker-start="url(#c)" marker-end="url(#c)"/>

<!-- BAR -->
<rect x="15" y="250" width="770" height="30" rx="15" fill="rgba(79,214,224,.07)" stroke="#4fd6e0" stroke-opacity=".6"/>
<text x="400" y="270" fill="#4fd6e0" font-size="12">OCP internship simulation  ·  attack → detect → mitigate</text>
<line x1="400" y1="283" x2="400" y2="297" stroke="#4fd6e0" marker-start="url(#c)" marker-end="url(#c)"/>

<!-- EVALUATION -->
<rect x="140" y="300" width="520" height="52" rx="6" fill="#0a0a0a" stroke="#222"/>
<text x="400" y="315" fill="#777" font-size="10" letter-spacing="2">EVALUATION</text>
<g font-size="10.5" fill="#ccc">
<path d="M190 342l8-14 8 14z" fill="none" stroke="#ff8a7a" stroke-width="1.8"/><line x1="198" y1="333" x2="198" y2="337" stroke="#ff8a7a" stroke-width="1.8"/>
<text x="214" y="338" text-anchor="start">Session hijack</text>
<circle cx="354" cy="332" r="6" fill="none" stroke="#ffaa00" stroke-width="2"/><line x1="359" y1="337" x2="364" y2="343" stroke="#ffaa00" stroke-width="2"/>
<text x="374" y="338" text-anchor="start">Detection</text>
<path d="M520 328l10 4v6c0 5-4 8-10 10c-6-2-10-5-10-10v-6z" fill="none" stroke="#f04b38" stroke-width="1.6"/><path d="M516 337l3 3 6-7" fill="none" stroke="#f04b38" stroke-width="1.6"/>
<text x="540" y="338" text-anchor="start">Mitigation</text>
</g>
</g>
